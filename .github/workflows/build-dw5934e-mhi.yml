
      - name: Collect driver packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find . -type f \( \
            -name '*mhi*pci*generic*.apk' -o \
            -name '*mhi*pci*generic*.ipk' -o \
            -name '*mhi*wwan*.apk' -o \
            -name '*mhi*wwan*.ipk' -o \
            -name 'kmod-mhi-bus*.apk' -o \
            -name 'kmod-mhi-bus*.ipk' \
          \) -not -path './output/*' -exec cp -v {} output/ \;
          echo "Collected packages:"
          find output -maxdepth 1 -type f -print
