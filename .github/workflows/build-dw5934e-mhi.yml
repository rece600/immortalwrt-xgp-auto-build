      - name: Build and verify DW5934e driver
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt

          echo "===== KERNEL VERSION ====="
          grep -R -n 'LINUX_VERSION' target/linux/rockchip/Makefile include/kernel-6.12.mk 2>/dev/null || true

          echo "===== BUILD HOST UTILITY ====="
          make tools/libdeflate/compile V=s
          test -x staging_dir/host/bin/libdeflate-gzip

          echo "===== BUILD KERNEL PACKAGE ====="
          make package/kernel/linux/compile V=s

          echo "===== COLLECT DRIVER PACKAGE ====="
          mkdir -p ../output
          find bin/packages -type f \
            \( -name 'kmod-mhi-pci-generic-*.apk' \
               -o -name 'kmod-mhi-pci-generic_*.ipk' \) \
            -exec cp -v {} ../output/ \;

          echo "===== VERIFY OUTPUT ====="
          find ../output -maxdepth 1 -type f -ls
          test -n "$(find ../output -type f -print -quit)"
