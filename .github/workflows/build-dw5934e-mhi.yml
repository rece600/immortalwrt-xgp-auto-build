```yaml
name: Build DW5934e MHI Driver

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workflow files
        shell: bash
        run: |
          set -euo pipefail
          echo "===== REPOSITORY ====="
          pwd
          ls -la
          echo "===== WORKFLOW ====="
          cat .github/workflows/build-dw5934e-mhi.yml

      - name: Stop until matching kernel source is configured
        shell: bash
        run: |
          echo "No driver build performed."
          echo "The ImmortalWrt source checkout and kernel configuration"
          echo "must match the router's Linux 6.12.108 build."
          exit 1
```
