name: Build DW5934e MHI for XGPv3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout XGP build scripts
        uses: actions/checkout@v4
        with:
          repository: zzzz0317/immortalwrt-xgp-auto-build
          ref: main
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo ./install-env.sh

      - name: Prepare source tree
        run: |
          chmod +x ./prepare.sh ./build.sh
          ./prepare.sh

      - name: Configure MHI PCIe driver
        shell: bash
        run: |
          set -euxo pipefail
          find . -maxdepth 4 -name xgp.config -o -name .config
          if [ -f xgp.config ]; then
            cp xgp.config /tmp/xgp.config.original
            grep -q 'CONFIG_PACKAGE_kmod-mhi-pci-generic' xgp.config || \
              printf '\nCONFIG_PACKAGE_kmod-mhi-pci-generic=m\n' >> xgp.config
          fi

      - name: Build firmware packages
        run: |
          ./build.sh

      - name: Collect driver packages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p output
          find . -type f \( \
            -name '*mhi*pci*generic*.apk' -o \
            -name '*mhi*pci*generic*.ipk' -o \
            -name '*mhi*wwan*.apk' -o \
            -name '*mhi*wwan*.ipk' \
          \) -exec cp -v {} output/ \;
          find output -type f -print
          test -n "$(find output -type f -print -quit)"

      - name: Upload driver packages
        uses: actions/upload-artifact@v4
        with:
          name: dw5934e-mhi-packages
          path: output/*
          if-no-files-found: error
