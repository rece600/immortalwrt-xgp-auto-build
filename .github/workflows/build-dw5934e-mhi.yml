```yaml
name: Build DW5934e MHI for XGPv3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TZ: Asia/Shanghai
      IMMORTALWRT_COMMIT: 89dfac46c9f1eaeb56c6cf49eb289b4475f446f7
      XGP_RELEASE_TAG: v0.261009.091418
      EXPECTED_KERNEL_ABI: "6.12.108~e199e4b734490b2de5e16f714589bf5a-r1"

    steps:
      - name: Checkout XGPv3 build scripts
        uses: actions/checkout@v4

      - name: Select XGPv3 release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git checkout --detach "$XGP_RELEASE_TAG"
          echo "XGP release: $XGP_RELEASE_TAG"

      - name: Install build dependencies
        run: sudo ./install-env.sh

      - name: Prepare source tree
        run: ./prepare.sh

      - name: Pin ImmortalWrt source
        shell: bash
        run: |
          set -euo pipefail
          git -C immortalwrt fetch origin "$IMMORTALWRT_COMMIT"
          git -C immortalwrt checkout --detach "$IMMORTALWRT_COMMIT"
          test "$(git -C immortalwrt rev-parse HEAD)" = "$IMMORTALWRT_COMMIT"
          echo "ImmortalWrt source: $(git -C immortalwrt rev-parse HEAD)"

      - name: Verify original XGPv3 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f xgp.config
          echo "Using the release's original xgp.config."
          sha256sum xgp.config

      - name: Build XGPv3 firmware and packages
        run: ./build.sh

      - name: Collect packages and build evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release_assets/mhi-packages
          mkdir -p release_assets/build-info
          mkdir -p release_assets/modules

          find immortalwrt/bin -type f \( \
            -name '*mhi*.apk' -o -name '*mhi*.ipk' -o \
            -name '*wwan*.apk' -o -name '*wwan*.ipk' \
          \) -exec cp -v
