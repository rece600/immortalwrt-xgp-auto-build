name: Build DW5934e MHI for XGPv3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TZ: Asia/Shanghai
      IMMORTALWRT_COMMIT: 89dfac46c9f1eaeb56c6cf49eb289b4475f446f7
      XGP_RELEASE_TAG: v0.261009.091418
      EXPECTED_KERNEL_ABI: "6.12.108~e199e4b734490b2de5e16f714589bf5a-r1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select XGPv3 release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git checkout --detach "$XGP_RELEASE_TAG"

      - name: Install build dependencies
        run: sudo ./install-env.sh

      - name: Prepare source tree
        run: ./prepare.sh

      - name: Pin ImmortalWrt source
        shell: bash
        run: |
          set -euo pipefail
          git -C immortalwrt fetch origin "$IMMORTALWRT_COMMIT"
          git -C immortalwrt checkout --detach "$IMMORTALWRT_COMMIT"
          test "$(git -C immortalwrt rev-parse HEAD)" = "$IMMORTALWRT_COMMIT"

      - name: Enable MHI packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("xgp.config")
          lines = path.read_text().splitlines()

          packages = [
              "kmod-mhi-pci-generic",
              "kmod-mhi-wwan-ctrl",
              "kmod-mhi-wwan-mbim",
              "kmod-wwan",
              "kmod-qrtr-mhi",
          ]

          for package in packages:
              key = f"CONFIG_PACKAGE_{package}"
              lines = [
                  line for line in lines
                  if not line.startswith(key + "=")
                  and line != f"# {key} is not set"
              ]
              lines.append(f"{key}=y")

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Build XGPv3 firmware and packages
        run: ./build.sh

      - name: Collect packages and verify kernel ABI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release_assets/mhi-packages
          mkdir -p release_assets/build-info

          find immortalwrt/bin -type f \( \
            -name '*mhi*.apk' -o -name '*mhi*.ipk' -o \
            -name '*wwan*.apk' -o -name '*wwan*.ipk' \
          \) -exec cp -v {} release_assets/mhi-packages/ \;

          pkg="$(find immortalwrt/bin -type f \
            -name 'kmod-mhi-pci-generic*.apk' -print -quit)"

          if [ -z "$pkg" ]; then
            echo "ERROR: Generic MHI PCIe APK was not built." >&2
            exit 1
          fi

          echo "Inspecting $pkg"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          if ! tar -xf "$pkg" -C "$work"; then
            echo "ERROR: Could not inspect APK archive." >&2
            exit 1
          fi

          if [ ! -f "$work/.PKGINFO" ]; then
            echo "ERROR: APK metadata (.PKGINFO) was not found." >&2
            exit 1
          fi

          cp "$work/.PKGINFO" \
            "release_assets/build-info/$(basename "$pkg").PKGINFO"

          cat "$work/.PKGINFO"

          if ! grep -Fq "kernel=$EXPECTED_KERNEL_ABI" "$work/.PKGINFO"; then
            echo "ERROR: Kernel ABI does not match the installed XGPv3 router." >&2
            echo "Expected: $EXPECTED_KERNEL_ABI" >&2
            echo "Do not install this package." >&2
            exit 1
          fi

          printf 'xgp_release_tag=%s\nimmortalwrt_commit=%s\nexpected_kernel_abi=%s\n' \
            "$XGP_RELEASE_TAG" "$IMMORTALWRT_COMMIT" "$EXPECTED_KERNEL_ABI" \
            > release_assets/build-info/source-pins.txt

      - name: Upload compiled packages
        uses: actions/upload-artifact@v4
        with:
          name: dw5934e-xgpv3-mhi-kernel-packages
          path: release_assets/
          if-no-files-found: error
          retention-days: 14
