
      - name: Build kernel and required modules only
        shell: bash
        run: |
          set -uo pipefail
          cd immortalwrt

          echo "===== Check configured target ====="
          grep -E '^(CONFIG_TARGET|CONFIG_LINUX|CONFIG_PACKAGE_kmod-mhi)' .config || true

          echo "===== Build kernel target with detailed logging ====="
          set +e
          make -j1 V=s target/linux/compile 2>&1 | tee /tmp/kernel-build.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [ "$build_status" -ne 0 ]; then
            echo "===== Relevant kernel build errors ====="
            grep -n -i -E 'error:|fatal:|undefined reference|no rule to make|cannot find|failed to build|Error [0-9]' \
              /tmp/kernel-build.log | tail -n 100 || true

            mkdir -p ../release_assets/build-info
            cp /tmp/kernel-build.log ../release_assets/build-info/kernel-build.log

            exit "$build_status"
          fi

          echo "===== Compile requested package ====="
          make -j1 V=s package/kernel/linux/compile
